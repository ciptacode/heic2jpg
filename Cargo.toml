[package]
name = "heic2jpg"
version = "0.1.0"
edition = "2024"
description = "HEIC to JPG/PNG converter using Rust and WebAssembly"
license = "MIT"
repository = "https://github.com/ciptacode/heic2jpg"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
heic = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
console_error_panic_hook = "0.1"
